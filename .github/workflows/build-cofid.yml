name: Build CoFID dataset

# GOV.UK is unreachable from the agent sandbox, so this runner downloads the McCance & Widdowson
# CoFID 2021 workbook, converts it with scripts/build-cofid.ts, runs the fixture tests and opens a PR.
on:
  workflow_dispatch:
    inputs:
      workbook_url:
        description: Direct URL of the CoFID 2021 Excel workbook on assets.publishing.service.gov.uk
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download workbook
        run: |
          mkdir -p tmp
          curl -fsSL "${{ inputs.workbook_url }}" -o tmp/cofid.xlsx
          ls -la tmp
      - name: Convert
        run: pnpm tsx scripts/build-cofid.ts tmp/cofid.xlsx data/cofid-2021.json
      - run: pnpm vitest run tests/unit/cofid-rules.test.ts
      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/cofid-2021
          title: "data: CoFID 2021 nutrition seed"
          commit-message: "data: add CoFID 2021 nutrition seed (OGL v3)"
          body: |
            Generated by the Build CoFID dataset workflow from the GOV.UK workbook.
            Contains public sector information licensed under the Open Government Licence v3.0.
          add-paths: |
            data/cofid-2021.json
            data/ATTRIBUTION.md
